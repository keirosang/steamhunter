<header class="site-header">
  <div class="header-inner container">
    <a href="{{ "/" | relURL }}" class="brand-logo" aria-label="回到首页">
      <span class="logo-icon">🎮</span>
      <span class="logo-text">
        <span class="logo-title">{{ .Site.Title }}</span>
        <span class="logo-badge">PAGES</span>
      </span>
    </a>

    <nav class="main-nav" id="mainNav">
      <ul class="nav-links">
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
        <li class="nav-item">
          <a class="nav-link {{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </nav>

    <div class="header-actions">
      <!-- Search Trigger or Quick Filter -->
      <div class="search-box">
        <input type="text" id="siteSearchInput" placeholder="快速筛选文章..." aria-label="搜索">
        <span class="search-icon">🔍</span>
      </div>

      <!-- Dark / Light Theme Toggle -->
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换明暗配色" aria-label="切换明暗配色">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>

      <!-- Mobile Hamburger -->
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="打开移动端菜单">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
