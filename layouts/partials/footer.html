<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <div class="footer-logo">🎮 {{ .Site.Title }}</div>
      <p class="footer-desc">{{ .Site.Params.subtitle }}</p>
    </div>

    <div class="footer-links">
      <div class="link-group">
        <h4>专栏导航</h4>
        <ul>
          <li><a href="{{ site.Home.RelPermalink }}">全部速递</a></li>
          <li><a href="{{ "/categories/限免福利/" | relURL }}">限免福利</a></li>
          <li><a href="{{ "/categories/特惠折扣/" | relURL }}">特惠折扣</a></li>
          <li><a href="{{ "/categories/游戏资讯/" | relURL }}">游戏资讯</a></li>
          <li><a href="{{ "/tags/" | relURL }}">标签索引</a></li>
          <li><a href="{{ "/about/" | relURL }}">关于本站</a></li>
        </ul>
      </div>
      <div class="link-group">
        <h4>平台直达</h4>
        <ul>
          <li><a href="{{ .Site.Params.tgChannel | default "https://t.me/steamhunterlink" }}" target="_blank" rel="noopener" style="color: var(--accent-cyan); font-weight: 600;">📢 Telegram 频道</a></li>
          <li><a href="{{ "index.xml" | relURL }}">RSS 订阅源</a></li>
          <li><a href="https://store.steampowered.com" target="_blank" rel="noopener">Steam 商店官网</a></li>
          <li><a href="https://steamcommunity.com" target="_blank" rel="noopener">Steam 玩家社区</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="container footer-bottom-inner">
      <p>© {{ now.Format "2006" }} {{ .Site.Params.author }}. 专注于 Steam 游戏情报、版本更新与特惠精选。</p>
      <button class="back-to-top" id="backToTopBtn" title="返回顶部">↑ 返回顶部</button>
    </div>
  </div>
</footer>
<script src="{{ "js/main.js" | relURL }}"></script>
