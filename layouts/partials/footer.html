<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <div class="footer-logo">🎮 {{ .Site.Title }}</div>
      <p class="footer-desc">{{ .Site.Params.subtitle }}</p>
      <div class="footer-meta">
        <span class="badge badge-tech">Hugo Static</span>
        <span class="badge badge-tech">GitHub Pages</span>
        <span class="badge badge-tech">AI Powered</span>
      </div>
    </div>

    <div class="footer-links">
      <div class="link-group">
        <h4>导航</h4>
        <ul>
          <li><a href="{{ "/" | relURL }}">最新速递</a></li>
          <li><a href="{{ "/categories/游戏资讯/" | relURL }}">游戏资讯</a></li>
          <li><a href="{{ "/categories/特惠折扣/" | relURL }}">特惠折扣</a></li>
          <li><a href="{{ "/tags/" | relURL }}">标签云</a></li>
          <li><a href="{{ "/about/" | relURL }}">关于本站</a></li>
        </ul>
      </div>
      <div class="link-group">
        <h4>资源与部署</h4>
        <ul>
          <li><a href="{{ "index.xml" | relURL }}">RSS 订阅源</a></li>
          <li><a href="https://gohugo.io" target="_blank" rel="noopener">Hugo 官方文档</a></li>
          <li><a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="container footer-bottom-inner">
      <p>© {{ now.Format "2006" }} {{ .Site.Params.author }}. 本站资讯由独立采集程序自动生成并同步至 GitHub Pages。</p>
      <button class="back-to-top" id="backToTopBtn" title="返回顶部">↑ 返回顶部</button>
    </div>
  </div>
</footer>
<script src="{{ "js/main.js" | relURL }}"></script>
